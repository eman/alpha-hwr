[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-hwr"
version = "0.1.0"
description = "Modern Python library and CLI for Grundfos ALPHA HWR pumps via Bluetooth Low Energy"
readme = "README.md"
authors = [
    { name = "Grundfos Firmware Team", email = "firmware@grundfos.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = [
    "grundfos",
    "alpha-hwr",
    "pump",
    "ble",
    "bluetooth",
    "iot",
    "hardware",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
dependencies = [
    "bleak>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/eman/alpha-hwr"
Documentation = "https://eman.github.io/alpha-hwr"
Repository = "https://github.com/eman/alpha-hwr"
Issues = "https://github.com/eman/alpha-hwr/issues"
Changelog = "https://github.com/eman/alpha-hwr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "tox>=4.0.0",
    "bump2version>=1.0.0",
    "basedpyright>=1.0.0",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
alpha-hwr = "alpha_hwr.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80
exclude = ["src/alpha_hwr/*_baseline.py"]

[tool.pyright]
typeCheckingMode = "standard"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
exclude = ["src/alpha_hwr/*_baseline.py"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["src/alpha_hwr/.*_baseline\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tools", "dist", "build", ".tox"]
