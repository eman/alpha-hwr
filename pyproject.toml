[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "mypy>=1.0.0",
    "ruff>=0.16.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "tox>=4.0.0",
    "basedpyright>=1.0.0",
]

[project]
name = "alpha-hwr"
dynamic = ["version"]
description = "Modern Python library and CLI for Grundfos ALPHA HWR pumps via Bluetooth Low Energy"
readme = "README.md"
authors = [
    { name = "Emmanuel Levijarvi", email = "emansl@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = [
    "grundfos",
    "alpha-hwr",
    "pump",
    "ble",
    "bluetooth",
    "iot",
    "hardware",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
dependencies = [
    "bleak>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "defusedxml>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/eman/alpha-hwr"
Documentation = "https://eman.github.io/alpha-hwr"
Repository = "https://github.com/eman/alpha-hwr"
Issues = "https://github.com/eman/alpha-hwr/issues"
Changelog = "https://github.com/eman/alpha-hwr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
]
dev = [
    "alpha-hwr[test]",
    "mypy>=1.0.0",
    "ruff>=0.16.1",
    "tox>=4.0.0",
    "basedpyright>=1.0.0",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-macros-plugin",
    "setuptools_scm>=8.0",
]

[project.scripts]
alpha-hwr = "alpha_hwr.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_hwr = ["py.typed"]

[tool.ruff]
line-length = 80
exclude = ["src/alpha_hwr/*_baseline.py"]

[tool.ruff.lint.per-file-ignores]
# The pump stores bare wall-clock fields with no offset, and its schedules
# run against that wall clock. Naive datetimes are the correct type here,
# not an oversight: attaching a timezone would invent information the pump
# does not carry, and converting to UTC is precisely the bug the ESPHome
# port had to fix. The production code carries the same exemption as
# per-line `noqa`s; these files are dense enough in them to say it once.
"tests/unit/services/test_single_event_rules.py" = ["DTZ001", "DTZ005"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API is call-in-default (`typer.Option(...)` /
# `typer.Argument(...)`); these are declarations, not shared mutable state.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
typeCheckingMode = "standard"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
exclude = ["src/alpha_hwr/*_baseline.py", "macros.py"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["src/alpha_hwr/.*_baseline\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tools", "dist", "build", ".tox"]
addopts = "-ra --strict-markers"
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]

[tool.hypothesis]
database = false
max_examples = 100
suppress_health_check = ["too_slow"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
