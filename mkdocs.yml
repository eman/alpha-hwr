  - Reference:
      - Hardware Details: reference/hardware.md
      - Data Models: reference/data_models.md
  - Integrations:
      - ESPHome / ESP32: integrations/esphome.md
  - Development:
      - Testing Strategy: TESTING_STRATEGY.md
