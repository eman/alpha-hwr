[tox]
min_version = 4.0
env_list =
    py313
    type
    lint
    format
    security
    basedpyright

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
setenv =
    TERM = xterm-256color
deps =
    pytest>=6.0
    pytest-asyncio
    pytest-cov
    pytest-benchmark
    pytest-xdist
    hypothesis
commands =
    # Run tests in parallel by default; use `-n 0` via posargs for sequential
    pytest {tty:--color=yes} -n auto {posargs}

[testenv:type]
description = run type checks
deps =
    mypy
commands =
    mypy {posargs:src/alpha_hwr}

[testenv:lint]
description = run linters
deps =
    ruff
commands =
    ruff check {posargs:.}

[testenv:security]
description = run security checks
deps =
    bandit
    safety
commands =
    bandit -r src/alpha_hwr -ll
    safety check

[testenv:basedpyright]
description = run basedpyright type checks
deps =
    basedpyright
commands =
    basedpyright {posargs:src/alpha_hwr}

[testenv:format]
description = format code with ruff
deps =
    ruff
commands =
    ruff format {posargs:.}
